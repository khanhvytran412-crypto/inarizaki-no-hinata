<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inarizaki no Hinata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4ecd8;
    --panel: #ebe0c4;
    --text: #3b2f20;
    --muted: #7a6a52;
    --accent: #a0522d;
    --line: #d9caa6;
    --fs: 19px;
  }
  :root[data-theme="dark"] {
    --bg: #17171a;
    --panel: #222227;
    --text: #d8d2c6;
    --muted: #8d877d;
    --accent: #e0915c;
    --line: #33333a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Literata", Georgia, serif;
    transition: background .25s, color .25s;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 760px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; gap: 8px;
    font-family: "Be Vietnam Pro", sans-serif; font-size: 14px;
  }
  .bar .title { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button, select {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 {
    font-size: 1.6em; text-align: center; margin: 8px 0 28px;
    font-weight: 600; color: var(--accent);
  }
  #content { font-size: var(--fs); line-height: 1.8; }
  #content p { margin: 0 0 1em; text-align: justify; }
  .nav {
    display: flex; gap: 10px; justify-content: space-between;
    margin-top: 32px; font-family: "Be Vietnam Pro", sans-serif;
  }
  .nav button { flex: 1; padding: 12px; font-size: 15px; }
  .nav button:disabled { opacity: .4; cursor: default; }
  #toc {
    display: none; max-width: 760px; margin: 0 auto; padding: 8px 16px 16px;
    font-family: "Be Vietnam Pro", sans-serif;
  }
  #toc.open { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  #toc button.cur { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .loading { color: var(--muted); text-align: center; font-family: "Be Vietnam Pro", sans-serif; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="title">Inarizaki no Hinata</span>
    <button id="tocBtn" title="Danh sách chương">☰ Chương</button>
    <button id="fsDown" title="Chữ nhỏ hơn">A−</button>
    <button id="fsUp" title="Chữ lớn hơn">A+</button>
    <button id="themeBtn" title="Đổi chế độ sáng/tối">🌙</button>
  </div>
  <div id="toc"></div>
</header>
<main>
  <h1 id="chTitle"></h1>
  <div id="content"><p class="loading">Đang tải…</p></div>
  <div class="nav">
    <button id="prevBtn">← Chương trước</button>
    <button id="nextBtn">Chương sau →</button>
  </div>
</main>
<script>
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const root = document.documentElement;
  const $ = id => document.getElementById(id);

  function applyTheme(t) {
    root.dataset.theme = t;
    $("themeBtn").textContent = t === "dark" ? "☀️" : "🌙";
  }
  applyTheme(store.get("theme") || "light");
  $("themeBtn").onclick = () => {
    const t = root.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(t); store.set("theme", t);
  };

  let fs = parseInt(store.get("fs"), 10) || 19;
  function applyFs() { root.style.setProperty("--fs", fs + "px"); store.set("fs", fs); }
  applyFs();
  $("fsUp").onclick = () => { fs = Math.min(fs + 1, 28); applyFs(); };
  $("fsDown").onclick = () => { fs = Math.max(fs - 1, 14); applyFs(); };

  $("tocBtn").onclick = () => $("toc").classList.toggle("open");

  let chapters = [];
  let idx = 0;

  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  function buildToc() {
    $("toc").innerHTML = "";
    chapters.forEach((n, i) => {
      const b = document.createElement("button");
      b.textContent = "Chương " + n;
      if (i === idx) b.className = "cur";
      b.onclick = () => { $("toc").classList.remove("open"); go(i); };
      $("toc").appendChild(b);
    });
  }

  async function go(i) {
    idx = i;
    const n = chapters[i];
    location.hash = n;
    store.set("last", n);
    $("chTitle").textContent = "Chương " + n;
    $("content").innerHTML = '<p class="loading">Đang tải…</p>';
    $("prevBtn").disabled = i === 0;
    $("nextBtn").disabled = i === chapters.length - 1;
    buildToc();
    window.scrollTo(0, 0);
    try {
      const res = await fetch("chapters/" + n + ".txt");
      const text = (await res.text()).normalize("NFC");
      $("content").innerHTML = text.split(/\r?\n/)
        .map(l => l.trim()).filter(Boolean)
        .map(l => "<p>" + esc(l) + "</p>").join("");
    } catch (e) {
      $("content").innerHTML = '<p class="loading">Không tải được chương này.</p>';
    }
  }

  $("prevBtn").onclick = () => idx > 0 && go(idx - 1);
  $("nextBtn").onclick = () => idx < chapters.length - 1 && go(idx + 1);
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") $("prevBtn").click();
    if (e.key === "ArrowRight") $("nextBtn").click();
  });

  fetch("chapters/list.json").then(r => r.json()).then(list => {
    chapters = list;
    const want = location.hash.slice(1) || store.get("last");
    const i = chapters.indexOf(Number(want));
    go(i >= 0 ? i : 0);
  });
  window.addEventListener("hashchange", () => {
    const i = chapters.indexOf(Number(location.hash.slice(1)));
    if (i >= 0 && i !== idx) go(i);
  });
</script>
</body>
</html>
